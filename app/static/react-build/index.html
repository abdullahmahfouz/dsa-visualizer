<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0e10" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Free interactive DSA learning tool for students. Visualize and understand data structures like Stack, Queue, Linked List, and Hash Tables with step-by-step explanations.">
    <title>DSA Visualizer - Free Learning Tool for Students | Data Structures & Algorithms</title>

    <!-- The two display faces are needed for first paint; preloading them
         keeps the swap from landing after the hero has already rendered. -->
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Applies a stored theme choice before first paint. Without this the
         page paints at the OS preference and then corrects itself once React
         mounts, which reads as a flash. Users on the system default are
         already correct from CSS alone and are left untouched. -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('dsa-theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) {
                /* storage unavailable: fall back to the OS preference */
            }
        })();
    </script>

  <link rel="stylesheet" crossorigin href="/assets/index-BABynJBh.css">
</head>

</body>
</html>
